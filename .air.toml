root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/tgdl-server ./cmd/tgdl-server"
entrypoint = ["./tmp/tgdl-server"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 250
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true

[proxy]
enabled = false
proxy_port = 3002
app_port = 3003
app_start_timeout = 30000
